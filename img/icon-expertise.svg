<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Chopsticks holding sushi -->
  <g stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="32" y1="18" x2="32" y2="42"/>
    <line x1="68" y1="18" x2="68" y2="42"/>
  </g>
  
  <!-- Sushi roll in chopsticks -->
  <circle cx="50" cy="32" r="9" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="50" cy="32" r="6" fill="#C8102E"/>
  <circle cx="50" cy="32" r="3" fill="#D4A84B"/>
  
  <!-- Plate -->
  <ellipse cx="50" cy="72" rx="30" ry="7" fill="none" stroke="#1A1A1A" stroke-width="3"/>
  <ellipse cx="50" cy="70" rx="27" ry="5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  
  <!-- Sushi on plate -->
  <circle cx="38" cy="68" r="8" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="38" cy="68" r="5" fill="#C8102E"/>
  <circle cx="38" cy="68" r="2.5" fill="#D4A84B"/>
  
  <circle cx="62" cy="68" r="8" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="62" cy="68" r="5" fill="#C8102E"/>
  <circle cx="62" cy="68" r="2.5" fill="#D4A84B"/>
</svg>
