<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Motion lines - thicker near truck, thinner as they extend -->
  <g stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="12" y1="48" x2="26" y2="48"/>
  </g>
  <g stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" opacity="0.4">
    <line x1="12" y1="53" x2="23" y2="53"/>
  </g>
  <g stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" opacity="0.3">
    <line x1="12" y1="58" x2="20" y2="58"/>
  </g>
  
  <!-- Truck cargo area -->
  <rect x="28" y="38" width="32" height="22" rx="2" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="28" y="38" width="18" height="22" fill="#C8102E"/>
  
  <!-- Truck cab -->
  <path d="M46 38 L56 38 L58 42 L58 60 L46 60 Z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="48" y="44" width="8" height="10" fill="#C8102E" opacity="0.2"/>
  
  <!-- Wheels -->
  <circle cx="38" cy="68" r="7" fill="#1A1A1A"/>
  <circle cx="38" cy="68" r="4" fill="#2A2A2A"/>
  <circle cx="38" cy="68" r="2" fill="#1A1A1A"/>
  
  <circle cx="56" cy="68" r="7" fill="#1A1A1A"/>
  <circle cx="56" cy="68" r="4" fill="#2A2A2A"/>
  <circle cx="56" cy="68" r="2" fill="#1A1A1A"/>
</svg>
