<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Motion lines - horizontal, tapered, extending from left -->
  <g stroke="#1A1A1A" stroke-linecap="round" opacity="0.5">
    <line x1="10" y1="48" x2="28" y2="48" stroke-width="4"/>
    <line x1="10" y1="53" x2="24" y2="53" stroke-width="3.5"/>
    <line x1="10" y1="58" x2="20" y2="58" stroke-width="3"/>
  </g>
  
  <!-- Truck body - rectangular cargo area -->
  <rect x="30" y="38" width="34" height="24" rx="2" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="30" y="38" width="20" height="24" fill="#C8102E"/>
  
  <!-- Truck cab - angular front -->
  <path d="M50 38 L60 38 L62 42 L62 62 L50 62 Z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Wheels - two solid black circles -->
  <circle cx="40" cy="70" r="8" fill="#1A1A1A"/>
  <circle cx="58" cy="70" r="8" fill="#1A1A1A"/>
</svg>
