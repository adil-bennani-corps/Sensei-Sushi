    <path d="M-5 -3 Q-5 -5 -3 -5 Q-1 -5 0 -3 Q1 -1 1 1 Q1 3 0 3 Q-1 3 -1 1 Q-1 -1 -2 -2 Q-3 -3 -4 -3 Q-5 -3 -5 -1 Q-5 1 -4 1 Q-3 1 -3 -1 Q-3 -3 -4 -3 Q-5 -3 -5 -1" fill="#1A1A1A"/>
    <!-- Right leaf -->
    <path d="M1 -3 Q1 -5 3 -5 Q5 -5 6 -3 Q7 -1 7 1 Q7 3 6 3 Q5 3 5 1 Q5 -1 4 -2 Q3 -3 2 -3 Q1 -3 1 -1 Q1 1 2 1 Q3 1 3 -1 Q3 -3 2 -3 Q1 -3 1 -1" fill="#1A1A1A"/>
