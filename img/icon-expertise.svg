<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Chopsticks holding sushi at top -->
  <g stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="30" y1="15" x2="30" y2="38"/>
    <line x1="70" y1="15" x2="70" y2="38"/>
  </g>
  
  <!-- Sushi roll held by chopsticks -->
  <circle cx="50" cy="30" r="10" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="50" cy="30" r="7" fill="#C8102E"/>
  <circle cx="50" cy="30" r="3.5" fill="#D4A84B"/>
  
  <!-- Plate - rectangular -->
  <rect x="20" y="60" width="60" height="8" rx="2" fill="none" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="22" y="62" width="56" height="4" rx="1" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
  
  <!-- Two sushi rolls on plate -->
  <circle cx="35" cy="64" r="9" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="35" cy="64" r="6" fill="#C8102E"/>
  <circle cx="35" cy="64" r="3" fill="#D4A84B"/>
  
  <circle cx="65" cy="64" r="9" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="65" cy="64" r="6" fill="#C8102E"/>
  <circle cx="65" cy="64" r="3" fill="#D4A84B"/>
</svg>
