  <!-- FRESH Text - Smaller, bold -->
  <text x="50" y="68" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle" letter-spacing="1.5px">FRESH</text>
